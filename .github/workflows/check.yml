name: check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # 17 and 21 do not work with the current setup
        jdkversion: [24, 25]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: koppor/gg/action@af034fd18934f51f117a1bb72102c5cbd04a96e0

      - name: Build (JDK ${{ matrix.jdkversion }})
        shell: bash
        run: gg.cmd run:java@${{ matrix.jdkversion }} bash ./build.sh

      - name: Upload FooClient
        uses: actions/upload-artifact@v4
        with:
          name: FooClient-jdk${{ matrix.jdkversion }}
          path: "*.deb"
          if-no-files-found: error
